[package]
name = "game-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
game-core.workspace = true
game-protocol.workspace = true
game-server.workspace = true
egui = "=0.31.1"
egui-winit = { version = "=0.31.1", default-features = false, features = ["x11", "wayland"] }
egui-wgpu = { version = "=0.31.1", default-features = false }
winit = "=0.30.13"
wgpu = "=24.0.1"
glam = "=0.30.10"
# Battle ship models; no file/URI import or image decoding needed for embedded .glb.
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
pollster = "=0.4.0"
resvg = { version = "=0.49.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

serde.workspace = true
serde_json.workspace = true
tempfile = "=3.27.0"
fastrand = "=2.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { version = "=0.31.1", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["console", "Document", "HtmlCanvasElement", "Window"] }
web-time = "=1.1.0"
wgpu = { version = "=24.0.1", default-features = false, features = ["fragile-send-sync-non-atomic-wasm", "webgl", "webgpu", "wgsl"] }

[features]
# Capture rendering, test scenes and scenario saves. Off by default so release
# builds ship without them: `cargo run -p game-client --features dev-tools -- ...`
dev-tools = ["game-server/dev-tools"]

[dev-dependencies]
game-server = { workspace = true, features = ["dev-tools"] }

[lints]
workspace = true
